# Used only if the Railway service Root Directory is set to `backend`.
# Prefer the repo-root Dockerfile + railway.toml (leave Root Directory empty).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
