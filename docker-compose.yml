services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_assistant
    ports:
      - "5432:5432"
    volumes:
      - pa_pg:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://pa_app:pa_app@postgres:5432/personal_assistant
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/personal_assistant
      CORS_ORIGINS: '["http://localhost:3000"]'
    command: ["python", "start_api.py"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "arq", "app.workers.arq_worker.WorkerSettings"]
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/personal_assistant
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/personal_assistant
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pa_pg:
