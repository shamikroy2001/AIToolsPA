# Railway service for the FastAPI API. Repo root = GitHub AIToolsPA.
# Worker: same image, start command:
#   arq app.workers.arq_worker.WorkerSettings
# Do not run alembic on the worker. Leave Root Directory empty (repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
