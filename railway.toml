# Railway API service only. Repo root = GitHub AIToolsPA.
# Worker service must use Dockerfile.worker and:
#   python -m arq app.workers.arq_worker.WorkerSettings
# Do not reuse this startCommand on the worker.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "Dockerfile", "Dockerfile.worker", "railway.toml"]

[deploy]
startCommand = "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
